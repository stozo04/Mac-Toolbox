# SwiftLint config for Toolbox. CI fails on errors; warnings are reported on the PR but don't block.
# Tuned to the existing style (long, documented lines and compact names); tighten over time.
included:
  - Sources/Toolbox
  - Tests
excluded:
  - Sources/CWebP   # vendored libwebp, not our code
  - .build

disabled_rules:
  - identifier_name          # short names like x, y, i, id, a are used deliberately
  - type_name
  - todo
  - trailing_comma
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - nesting

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 1000
  error: 2500
type_body_length:
  warning: 600
  error: 1500
function_body_length:
  warning: 120
  error: 400
cyclomatic_complexity:
  warning: 25
  error: 60
  ignores_case_statements: true
function_parameter_count:
  warning: 8
  error: 12
large_tuple:
  warning: 4
  error: 8   # AVAsset track.load(...) returns wide tuples
