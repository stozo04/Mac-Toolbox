# SwiftLint config for Toolbox. CI fails on errors; warnings are reported on the PR but don't block.
# The size limits are a ratchet: each warning sits just above the largest case in the code today, each error a clear step
# above that, so new code cannot grow past what exists. Largest today: file 756 lines, type body 591, function body 87,
# cyclomatic complexity 18. When the largest case shrinks, lower its limit to match.
included:
  - Sources/Toolbox
  - Tests
excluded:
  - Sources/CWebP   # vendored libwebp, not our code
  - .build

disabled_rules:
  - identifier_name          # short names like x, y, i, id, a are used deliberately
  - type_name
  - todo
  - trailing_comma
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - nesting

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true
file_length:
  warning: 800
  error: 1000
type_body_length:
  warning: 600
  error: 700
function_body_length:
  warning: 100
  error: 150
cyclomatic_complexity:
  warning: 20
  error: 30
  ignores_case_statements: true
function_parameter_count:
  warning: 8
  error: 12
large_tuple:
  warning: 4
  error: 8   # AVAsset track.load(...) returns wide tuples

custom_rules:
  test_literal_subscript:
    name: "Literal subscript in a test"
    included: "Tests/.*\\.swift"
    regex: "(?<=[\\w\\)\\]\\?!])\\[\\d+\\](?!\\s*[-+*/^|&]?=[^=])"
    excluded_match_kinds: [comment, doccomment, string]
    message: "A wrong count traps and kills the whole test run. Use try XCTUnwrap(x.first) or try x.element(at:)."
    severity: error
  test_unshared_wait:
    name: "Task.sleep in a test"
    included: "Tests/.*\\.swift"
    excluded: "Tests/ToolboxTests/TestSupport\\.swift"
    regex: "Task\\s*\\.\\s*sleep"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Wait with waitUntil in TestSupport.swift, which fails the test at its deadline."
    severity: error
  test_general_pasteboard:
    name: "NSPasteboard.general in a test"
    included: "Tests/.*\\.swift"
    regex: "NSPasteboard\\s*\\.\\s*general"
    excluded_match_kinds: [comment, doccomment, string]
    message: "This is the user's clipboard. Inject makeScratchPasteboard() from TestSupport.swift."
    severity: error
  test_unmanaged_defaults:
    name: "UserDefaults(suiteName:) in a test"
    included: "Tests/.*\\.swift"
    excluded: "Tests/ToolboxTests/TestSupport\\.swift"
    regex: "UserDefaults\\s*(\\.init)?\\s*\\(\\s*suiteName"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Use makeScratchDefaults in TestSupport.swift, which keeps the suite out of ~/Library/Preferences and removes it afterwards."
    severity: error
  process_outside_shell:
    name: "Process() outside Shell"
    included: "Sources/Toolbox/.*\\.swift"
    excluded:
      - "Sources/Toolbox/Support/Shell\\.swift"
      - "Sources/Toolbox/Vault/VaultDisk\\.swift"   # runAndWait locks the vault while the app quits; to be moved into Shell
    regex: "(?<![\\w.])Process\\s*(\\.\\s*init)?\\s*\\("
    excluded_match_kinds: [comment, doccomment, string]
    message: "Run programs with Shell.run, which stops them on cancel, on timeout and when the app quits."
    severity: error
  hand_written_file_drop:
    name: ".onDrop(of:) outside FileDrop"
    included: "Sources/Toolbox/.*\\.swift"
    excluded:
      - "Sources/Toolbox/Views/FileDrop\\.swift"
      - "Sources/Toolbox/Vault/VaultLibraryView\\.swift"   # already hands over one drop in one call; to be moved onto fileDrop
    regex: "\\bonDrop\\s*\\(\\s*of\\s*:"
    excluded_match_kinds: [comment, doccomment, string]
    message: "Use .fileDrop { urls in … } from Views/FileDrop.swift, which hands over every dropped file in one call."
    severity: error
