name: Build Toolbox.app
description: Fetches the helper tools and llama.cpp (both cached) and runs scripts/make-app.sh, which leaves an ad-hoc signed dist/Toolbox.app and dist/Toolbox.zip.

inputs:
  build-number:
    description: CFBundleVersion of the app.
    required: true

runs:
  using: composite
  steps:
    - name: Cache yt-dlp + ffmpeg (built by scripts/fetch-tools.sh)
      id: tools-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build/tools
        key: tools-${{ runner.os }}-arm64-${{ hashFiles('scripts/fetch-tools.sh') }}
    - name: Fetch and build helper tools
      if: steps.tools-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ARCHS: arm64
      run: scripts/fetch-tools.sh
    - name: Cache llama.cpp (built by scripts/build-llama.sh)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: Vendor/llama
        key: llama-${{ runner.os }}-${{ hashFiles('scripts/build-llama.sh', 'scripts/llama.cpp-no-logits.patch') }}
    - name: Build the app (release, ad-hoc signed; version from ReleaseNotes.swift)
      shell: bash
      env:
        ARCHS: arm64
        BUILD: ${{ inputs.build-number }}
      run: scripts/make-app.sh
