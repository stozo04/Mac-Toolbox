name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version bumped
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version raised and release notes added (AGENTS.md, "Versioning")
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version-bump.sh "origin/$BASE_REF"

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh scripts/lib/*.sh .github/scripts/*.sh
      - name: No pipe into grep -q (under pipefail the writer dies of SIGPIPE and the pipeline fails)
        run: |
          if grep -nE '(^|[^|])\|[[:space:]]*grep[[:space:]]+(-[[:alnum:]]*q|--quiet)' scripts/*.sh scripts/lib/*.sh .github/scripts/*.sh; then
            echo "::error::Capture the output first, or send grep's output to /dev/null instead of using -q."
            exit 1
          fi
      - name: Release notes for this version read cleanly (used by scripts/release.sh)
        run: |
          version="$(sed -n 's/^ *static let current = "\(.*\)".*/\1/p' Sources/Toolbox/Support/ReleaseNotes.swift | head -1)"
          .github/scripts/release-body.sh Sources/Toolbox/Support/ReleaseNotes.swift "$version"
