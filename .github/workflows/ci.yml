name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Version bumped
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version raised and release notes added (AGENTS.md, "Versioning")
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version-bump.sh "origin/$BASE_REF"
      - name: Release notes for this version read cleanly (used by scripts/release.sh)
        run: |
          version="$(sed -n 's/^ *static let current = "\(.*\)".*/\1/p' Sources/Toolbox/Support/ReleaseNotes.swift | head -1)"
          .github/scripts/release-body.sh Sources/Toolbox/Support/ReleaseNotes.swift "$version"
