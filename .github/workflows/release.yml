name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag on main to publish, like v0.14.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  NOTES_SWIFT: Sources/Toolbox/Support/ReleaseNotes.swift

jobs:
  build:
    name: Build Toolbox.app for the release (macOS)
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.check.outputs.version }}
      latest: ${{ steps.check.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      # A dispatch for an older tag builds that tag's app, but its commit may predate the release tooling,
      # so the build action and notes script always come from the workflow's own commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: release-tools
          sparse-checkout: .github
      - name: Tag is a version on main that has no release yet
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a vMAJOR.MINOR.PATCH tag."; exit 1; }
          version="${TAG#v}"
          app_version="$(sed -n 's/^ *static let current = "\(.*\)".*/\1/p' "$NOTES_SWIFT" | head -1)"
          [ "$app_version" = "$version" ] || { echo "::error::$TAG points at a commit whose AppVersion.current is $app_version."; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::$TAG is not on main."; exit 1; }
          released="$(gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
          if grep -qxF "$TAG" <<< "$released"; then
            echo "::error::A release for $TAG already exists; it is never replaced."
            exit 1
          fi
          highest="$(grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' <<< "$released" | sort -V | tail -1)"
          if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
            latest=true
          else
            latest=false
          fi
          echo "Highest published release: ${highest:-none}. $TAG becomes Latest: $latest."
          {
            echo "version=$version"
            echo "previous=${highest#v}"
            echo "latest=$latest"
          } >> "$GITHUB_OUTPUT"
      - name: Build Toolbox.app
        uses: ./release-tools/.github/actions/build-app
        with:
          build-number: ${{ github.run_number }}
      - name: Name the download and write the release notes
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PREVIOUS: ${{ steps.check.outputs.previous }}
          RUN_ID: ${{ github.run_id }}
        run: |
          codesign -dv dist/Toolbox.app 2>&1 | grep -qx 'Signature=adhoc' || { echo "::error::Toolbox.app is not ad-hoc signed."; exit 1; }
          mkdir release
          mv dist/Toolbox.zip "release/Toolbox-$VERSION-arm64.zip"
          {
            release-tools/.github/scripts/release-notes.sh "$NOTES_SWIFT" "$VERSION" "$PREVIOUS"
            echo
            echo "The full history is inside the app: click the version number in the bottom-right corner."
            echo
            echo "**Needs** macOS 14 or later on an Apple silicon Mac."
            echo
            echo "**Opening it the first time**"
            echo "This build is ad-hoc signed, not notarized by Apple, so macOS blocks it once. Unzip it, drag Toolbox.app to Applications and open it. When macOS refuses, open System Settings > Privacy & Security and click **Open Anyway** ([Apple's steps](https://support.apple.com/guide/mac-help/mh40616/mac)). Or run:"
            echo "\`xattr -dr com.apple.quarantine /Applications/Toolbox.app\`"
            echo
            echo "Built by this repo's CI from the tagged commit (run $RUN_ID). Includes yt-dlp (Unlicense) and an LGPL build of FFmpeg; see \`Contents/Resources/Licenses/THIRD_PARTY_NOTICES.md\`. Only download videos you own or have permission to save."
          } > release/notes.md
          cat release/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          gh release create "$TAG" "release/Toolbox-$VERSION-arm64.zip" \
            --verify-tag --latest="$LATEST" --title "Toolbox $VERSION" --notes-file release/notes.md
      - name: The published download matches the build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          asset="Toolbox-$VERSION-arm64.zip"
          gh release download "$TAG" --pattern "$asset" --dir published
          built="$(sha256sum "release/$asset" | cut -d' ' -f1)"
          published="$(sha256sum "published/$asset" | cut -d' ' -f1)"
          [ "$built" = "$published" ] || { echo "::error::The published $asset differs from the build."; exit 1; }
          echo "Published $asset (sha256 $published): $(gh release view "$TAG" --json url --jq .url)"
